<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #e5e7eb; }
      .title { font-size: 28px; font-weight: bold; }
      .heading { font-size: 18px; font-weight: bold; }
      .subheading { font-size: 15px; fill: #cbd5e1; }
      .label { font-size: 15px; font-weight: bold; }
      .box { font-size: 13px; }
      .small { font-size: 12px; fill: #cbd5e1; }
      .tiny { font-size: 11px; fill: #cbd5e1; }
      .hdr { font-size: 12px; font-weight: bold; fill: #93c5fd; }
      .star { font-size: 13px; font-weight: bold; fill: #6ee7b7; }
      .frame { fill: #263449; stroke: #60a5fa; stroke-width: 1.5; }
      .object { fill: #174b43; stroke: #34d399; stroke-width: 1.3; }
      .freed { fill: #6b2230; stroke: #f87171; stroke-width: 1.3; }
      .unused { fill: #253244; stroke: #64748b; stroke-dasharray: 4 3; }
      .general { fill: #654b28; stroke: #fbbf24; stroke-width: 1.3; }
      .pool { fill: #3b2a63; stroke: #a78bfa; stroke-width: 1.3; }
      .namepool { fill: #0e4a5c; stroke: #22d3ee; stroke-width: 1.3; }
      .panel { fill: #192638; stroke: #475569; }
    </style>
  </defs>

  <rect width="1500" height="1000" rx="12" fill="#101827"/>

  <text x="750" y="42" text-anchor="middle" class="title">Fusion – Where the Data Lives in Hardware</text>
  <text x="750" y="70" text-anchor="middle" class="subheading">Fast and small at the top, slow and large at the bottom • the stack, heap and Data Stacks all live in RAM</text>

  <text x="50" y="104" class="hdr">HARDWARE LAYER • SIZE • SPEED</text>
  <text x="290" y="104" class="hdr">FUSION'S USE OF IT</text>
  <text x="850" y="104" class="hdr">ZOOM: INSIDE RAM (OS maps virtual addresses to physical RAM)</text>

  <!-- ROW 0: registers -->
  <rect x="30" y="115" width="770" height="88" rx="8" fill="#3a1f3d" stroke="#f472b6" stroke-width="1.5"/>
  <line x1="270" y1="123" x2="270" y2="195" stroke="#475569"/>
  <text x="50" y="143" class="label">CPU REGISTERS</text>
  <text x="50" y="164" class="small">~16–32 per core (bytes)</text>
  <text x="50" y="183" class="small">&lt; 1 ns</text>
  <text x="290" y="143" class="box">• Temporaries and loop counters</text>
  <text x="290" y="164" class="box">• Stack pointer + object references</text>
  <text x="290" y="183" class="box">• Register-only targets live here only</text>

  <!-- ROW 1: L1 -->
  <rect x="30" y="213" width="770" height="88" rx="8" fill="#1d3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="270" y1="221" x2="270" y2="293" stroke="#475569"/>
  <text x="50" y="241" class="label">L1 CACHE</text>
  <text x="50" y="262" class="small">32–64 KB per core</text>
  <text x="50" y="281" class="small">~1 ns</text>
  <text x="290" y="241" class="box">• Hottest stack frames</text>
  <text x="290" y="262" class="box">• Data Stack lines being used right now</text>
  <text x="290" y="281" class="box">• Automatic – Fusion cannot address it</text>

  <!-- ROW 2: L2 -->
  <rect x="30" y="311" width="770" height="88" rx="8" fill="#1a3350" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="270" y1="319" x2="270" y2="391" stroke="#475569"/>
  <text x="50" y="339" class="label">L2 CACHE</text>
  <text x="50" y="360" class="small">256 KB – 2 MB per core</text>
  <text x="50" y="379" class="small">~3–5 ns</text>
  <text x="290" y="339" class="box">• Recently used stack + Data Stack lines</text>
  <text x="290" y="360" class="box">• Spill-over from L1</text>
  <text x="290" y="379" class="box">• Automatic copies of RAM</text>

  <!-- ROW 3: L3 -->
  <rect x="30" y="409" width="770" height="88" rx="8" fill="#172b44" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="270" y1="417" x2="270" y2="489" stroke="#475569"/>
  <text x="50" y="437" class="label">L3 CACHE</text>
  <text x="50" y="458" class="small">8–64+ MB, shared by cores</text>
  <text x="50" y="477" class="small">~10–20 ns</text>
  <text x="290" y="437" class="box">• Warm Data Stack lines shared between cores</text>
  <text x="290" y="458" class="box">• Reduces trips to RAM</text>
  <text x="290" y="477" class="box">• Automatic copies of RAM</text>

  <!-- ROW 4: RAM (highlight) -->
  <rect x="30" y="507" width="770" height="88" rx="8" fill="#14403a" stroke="#34d399" stroke-width="3"/>
  <line x1="270" y1="515" x2="270" y2="587" stroke="#475569"/>
  <text x="50" y="535" class="label">RAM (DRAM)</text>
  <text x="50" y="556" class="small">Gigabytes</text>
  <text x="50" y="575" class="small">~60–100 ns</text>
  <text x="290" y="535" class="star">★ PRIMARY STACK</text>
  <text x="290" y="556" class="star">★ MANAGED HEAP + ALL DATA STACKS</text>
  <text x="290" y="575" class="box">• The real home of Fusion's memory</text>

  <!-- ROW 5: storage -->
  <rect x="30" y="605" width="770" height="88" rx="8" fill="#2a2f3a" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="613" x2="270" y2="685" stroke="#475569"/>
  <text x="50" y="633" class="label">SSD / HDD</text>
  <text x="50" y="654" class="small">100s of GB – TBs</text>
  <text x="50" y="673" class="small">SSD ~0.1 ms • HDD ~5–10 ms</text>
  <text x="290" y="633" class="box">• Program file and persistent data</text>
  <text x="290" y="654" class="box">• Swap only if RAM runs out (avoid)</text>
  <text x="290" y="673" class="box">• Never holds live stacks by design</text>

  <!-- connector to zoom -->
  <path d="M800 551 H846" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- RAM ZOOM -->
  <rect x="850" y="115" width="620" height="578" rx="12" fill="#17283d" stroke="#34d399" stroke-width="2.5"/>
  <text x="1160" y="145" text-anchor="middle" class="heading">RAM</text>

  <!-- primary stack -->
  <rect x="870" y="165" width="140" height="425" rx="8" fill="#17283d" stroke="#60a5fa" stroke-width="2"/>
  <text x="940" y="187" text-anchor="middle" class="label">PRIMARY STACK</text>
  <rect x="885" y="205" width="110" height="50" rx="5" class="frame"/>
  <text x="940" y="235" text-anchor="middle" class="box">Frame 3</text>
  <rect x="885" y="265" width="110" height="50" rx="5" class="frame"/>
  <text x="940" y="295" text-anchor="middle" class="box">Frame 2</text>
  <rect x="885" y="325" width="110" height="50" rx="5" class="frame"/>
  <text x="940" y="355" text-anchor="middle" class="box">Frame 1</text>
  <path d="M940 385 V415" stroke="#60a5fa" stroke-width="2" marker-end="url(#blueArrow)"/>
  <text x="940" y="440" text-anchor="middle" class="tiny">grows with calls</text>
  <text x="940" y="490" text-anchor="middle" class="tiny">Small and reused</text>
  <text x="940" y="506" text-anchor="middle" class="tiny">constantly, so it</text>
  <text x="940" y="522" text-anchor="middle" class="tiny">stays hot in L1</text>

  <!-- heap -->
  <rect x="1040" y="165" width="410" height="425" rx="8" fill="#17283d" stroke="#a78bfa" stroke-width="2"/>
  <text x="1245" y="187" text-anchor="middle" class="label">MANAGED HEAP</text>

  <rect x="1055" y="205" width="380" height="75" rx="6" fill="#182b3e" stroke="#34d399" stroke-width="1.5"/>
  <rect x="1065" y="212" width="85" height="34" rx="4" class="object"/>
  <text x="1107" y="234" text-anchor="middle" class="tiny">Account</text>
  <rect x="1157" y="212" width="85" height="34" rx="4" class="object"/>
  <text x="1199" y="234" text-anchor="middle" class="tiny">Ledger</text>
  <rect x="1249" y="212" width="85" height="34" rx="4" class="object"/>
  <text x="1291" y="234" text-anchor="middle" class="tiny">Transaction</text>
  <rect x="1341" y="212" width="85" height="34" rx="4" class="object"/>
  <text x="1383" y="234" text-anchor="middle" class="tiny">Audit</text>
  <text x="1245" y="266" text-anchor="middle" class="tiny">Data Stack&lt;Single&gt; – one 64-byte cache line loads neighbours too</text>

  <rect x="1055" y="288" width="380" height="44" rx="6" class="object"/>
  <text x="1070" y="315" class="box">Data Stack&lt;Mixed&gt;</text>
  <text x="1420" y="315" text-anchor="end" class="tiny">boxes reused</text>

  <rect x="1055" y="340" width="380" height="44" rx="6" class="pool"/>
  <text x="1070" y="367" class="box">Data Stack&lt;String&gt; – StringPool</text>
  <text x="1420" y="367" text-anchor="end" class="tiny">each string once</text>

  <rect x="1055" y="392" width="380" height="44" rx="6" class="namepool"/>
  <text x="1070" y="419" class="box">Data Stack&lt;Customer&gt; – CustomerPool</text>
  <text x="1420" y="419" text-anchor="end" class="tiny">uniform objects</text>

  <rect x="1055" y="444" width="380" height="44" rx="6" class="general"/>
  <text x="1070" y="471" class="box">Data Stack&lt;General&gt;</text>
  <text x="1420" y="471" text-anchor="end" class="tiny">scattered, short-lived</text>

  <rect x="1055" y="496" width="380" height="84" rx="6" class="unused"/>
  <text x="1245" y="534" text-anchor="middle" class="small">Free heap space</text>
  <text x="1245" y="552" text-anchor="middle" class="tiny">grown on demand by the Memory Manager</text>

  <!-- program image -->
  <rect x="870" y="605" width="580" height="70" rx="8" fill="#3b2a63" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1160" y="633" text-anchor="middle" class="label">Program image and constants</text>
  <text x="1160" y="654" text-anchor="middle" class="small">Loaded from SSD/HDD at start • when the primary stack ends, the OS reclaims all of RAM</text>

  <!-- INFO PANELS -->
  <rect x="30" y="715" width="470" height="260" rx="10" class="panel"/>
  <text x="50" y="743" class="label">HOW A READ TRAVELS</text>
  <text x="50" y="777" class="small">1. CPU needs a value and checks L1 first.</text>
  <text x="50" y="805" class="small">2. On a miss it tries L2, then L3, then RAM.</text>
  <text x="50" y="833" class="small">3. The whole 64-byte line is copied up to the faster levels.</text>
  <text x="50" y="861" class="small">4. Later reads of nearby bytes hit L1 (fast).</text>
  <text x="50" y="889" class="small">5. Writes reach RAM later (write-back).</text>
  <text x="50" y="917" class="small">6. If RAM is full, the OS may swap pages to SSD/HDD (very slow).</text>

  <rect x="515" y="715" width="470" height="260" rx="10" class="panel"/>
  <text x="535" y="743" class="label">WHY DATA STACKS HELP THE CACHE</text>
  <text x="535" y="777" class="small">• Related objects sit side by side: one line loads several.</text>
  <text x="535" y="805" class="small">• Freed boxes are reused, so the same memory stays warm.</text>
  <text x="535" y="833" class="small">• String pool stores each string once: fewer lines touched.</text>
  <text x="535" y="861" class="small">• Typed pools hold uniform objects: predictable access.</text>
  <text x="535" y="889" class="small">• General Data Stack is scattered: expect more cache misses.</text>
  <text x="535" y="917" class="small">• Dropping a Data Stack frees one contiguous block.</text>

  <rect x="1000" y="715" width="470" height="260" rx="10" class="panel"/>
  <text x="1020" y="743" class="label">SMALL DEVICES (MCU / REGISTER-ONLY)</text>
  <text x="1020" y="777" class="small">• Usually no L1/L2/L3 and no virtual memory.</text>
  <text x="1020" y="805" class="small">• SRAM holds the static Data Stacks (fixed size).</text>
  <text x="1020" y="833" class="small">• Flash holds code, constants and the string table.</text>
  <text x="1020" y="861" class="small">• Registers hold inputs, outputs and temporaries.</text>
  <text x="1020" y="889" class="small">• Register-only: nothing lives in RAM at all.</text>
  <text x="1020" y="917" class="small">• Some larger MCUs add a small cache in front of flash.</text>
  <text x="1020" y="955" class="tiny">Conceptual diagram – sizes and latencies are typical, not exact.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
