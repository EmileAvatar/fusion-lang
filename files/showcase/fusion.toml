# fusion.toml - every project setting a finished Fusion will have (Task 23.9, 2026-10-23)
#
# Goes with Fusion_showcase.fusion. Each setting has a comment line before it:
#   [built]     the compiler reads it today      [designed]  in the language spec, not built
#   [idea]      not designed yet                 [rejected]  decided against
# Every setting is optional; the value shown is the default. A misspelled key or a bad value
# is an error, never silently ignored [built].
# [built] The same settings may also be written as fusion.yaml / .json / .ini (Task 31); in a
# folder TOML is used first, then YAML, JSON, INI. Every built setting, its values and default:
# files/fusionSettings.xml (the master template).

# [designed] The project itself: name, version, the file that holds main
[project]
name = "showcase"
version = "0.1.0"
main = "Fusion_showcase.fusion"
# [built] The format of this file: TOML | YAML | JSON | INI - change it and the next compile
# rewrites the file in that format, keeping the old one as a .bak (Task 31)
fusionSettingFormat = "TOML"

[indentation]
# [built] Spaces per tab
tabWidth = 4
# [built] Mixed tabs and spaces: a warning (true) or an error (false)
allowMixed = true
# [idea] Allow only some block styles in this project: indent, end, braces
blockStyles = ["indent", "end", "braces"]

[source]
# [built] Identifiers ASCII-only unless turned on (look-alike letter defense)
allowUnicodeIdentifiers = false

[strings]
# [built] utf-8 or ascii; [designed] utf-16 / utf-32
encoding = "utf-8"
# [built] "max" = no limit; a number = a longer string is a StringTooLongError
maxLength = "max"
# [rejected] A "mutable" switch - a string variable can always be changed in place (s[i] = c,
# Task 29.1); a const string is fixed (29.2)
# [designed] Identical text stored once (Task 29.4 - postponed to Task 38)
pooling = false
# [designed] Strings may be null (default false - "" instead) (Task 30.3)
nullable = false

[numbers]
# [built] false: an int used as a float must fit exactly (else PrecisionError); true: a warning
autoWidening = false
# [built] Whole-number + - * wraps (a byte: 255 + 1 is 0); false: an OverflowError (Task 32.0)
overflowWrap = false

[errors]
# [built] T, Error function / capturing errors
returns = true
# [built] try / catch / finally / throw
exceptions = true
# [designed] Every error carries a stack trace
stackTraces = true

[structs]
# [built] Deepest struct nesting allowed, and the depth that warns
maxNestingDepth = 3
warnNestingDepth = 3
# [built] "owned" - each struct holds its own strings; [designed] "pooled" (Task 29)
stringStorage = "owned"
# [built] false: string fields can't change after construction
stringMutable = true
# [built] Warn when a string field is longer than this (0 = never)
stringWarnLength = 64
# [built] A struct field may be a List or Map (false: such a field is an error)
holdCollections = true
# [built] Methods inside a struct - p.move(1, 2) changes p (Task 32.1); off by default
functions = false
# [designed] Classes inside structs - off by default
classes = false

[conditions]
# [built] A number as a condition: positive (above zero is true) | nonzero (C, Python) | off
numbers = "positive"

[arrays]
# [designed] Arrays may be null (default false - [] instead) (Task 30.3); they grow at the
# end (Task 45)
nullable = false

[collections]
# [designed] Lists and maps share a pool of threads ("shared") or get their own
# ("dedicated") (Task 42.17)
threads = "shared"
sharedThreads = 10

[functions]
# [designed] Several return values per function (user, 2026-10-23: off unless allowed);
# a function that can fail always has its Error last
multipleReturns = false

[language]
# [idea] Operator overloading (+ on your own types) - only for exceptional cases (user)
operatorOverloading = false

[console]
# [idea] The line ending println uses: "system" (the PC's own) | "lf" | "crlf"
lineEnding = "system"

[stdlib]
# [built] std (everything) | alloc (no OS: no print, no files) | core (no heap)
layer = "std"

[safety]
# [built] safe (default) | strict (every warning is an error) | unsafe (the whole project)
mode = "safe"
# [built] Endless recursion: "max" = caught by stack use; a number also counts calls
maxCallDepth = "max"
# [rejected] Turning off array bounds checks - they stay on even in unsafe mode (Task 27.1)
# [designed] strict mode: null checks forced, Weak<T> is an error, callbacks limited
nullChecks = "strict"
# [designed] Loop protection: the most passes a loop may make (0 = no limit)
maxIterations = 0

[memory]
# [designed] gc (automatic) | smart (Unique / Shared / Weak) | manual (raw pointers) (Task 38)
strategy = "smart"
# [rejected] Non-atomic Shared counts as an option - always atomic (decided 2026-09-13)

[threads]
# [designed] Threads allowed at all (off for small devices)
enabled = true
# [idea] Size of the thread pool ("auto" = one per CPU core)
poolSize = "auto"

[modules]
# [built] Module-level variables (module constants are always allowed) (Task 44.1)
variables = true
# [idea] Extra folders searched for imported modules
paths = ["lib", "vendor"]
# [designed] Libraries must declare what they may do (files, network, ...) (Task 39)
requireCapabilities = true

[backend]
# [built] "c"; [designed] "llvm" (Task 40)
target = "c"
# [designed] The platform to build for: windows-x64, linux-x64, wasm, ...
platform = "windows-x64"

[build]
# [designed] debug | release
mode = "debug"
# [designed] speed | size | none
optimize = "none"
# [designed] exe | lib (a DLL / shared library)
output = "exe"
# [built] Wait for a key before the window closes, so the output can be read - for
# development, examples and testing (default false; --headless never waits)
waitAtExit = false

[docs]
# [designed] Make documentation from /** */ comments
generate = false
output = "docs/"

[hardware]
# [idea] Hardware descriptions to import (HIDL, Task 41)
hidl = ["MicrowaveController.hidl"]
